name: CI

on:
  pull_request:
  push:
    branches: [main]
  # 供 deploy.yml 复用（单一门禁事实源）：生产发布必须先过本门禁
  workflow_call:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 门禁 1：类型检查
      - run: pnpm typecheck
      # 门禁 1.5：i18n 生成物与 PHP 源一致（T1-5，一次生成纳入 CI）
      - run: pnpm i18n:check
      # 门禁 1.6：字体子集覆盖全部词条用字（防新增生僻字后静默回退系统字）
      - run: pnpm fonts:check
      # 门禁 2：单测（含三预算断言）
      - run: pnpm test
      # 门禁 3：D1 迁移 dry-run（本地 SQLite 全量应用）
      - name: D1 migrations dry-run
        working-directory: apps/api
        run: |
          npx wrangler d1 create freeidx --local || true
          npx wrangler d1 migrations apply freeidx --local
      # 门禁 3.5：迁移终态必须与 schema.sql 快照逐对象一致
      # 防的是「迁移文件都对、终态却漂移」：新增迁移漏了热路径索引（0021/0022 都漏过），
      # 或改了迁移却忘了同步快照。
      # 关键作用：schema.sql 是「已验证终态」的基准，所以它同时能抓出「重排/合并迁移时漏列漏索引」——
      # 若将来把 0001~0022 折叠成一份，新旧终态的任何差异都会在这里红，不必依赖人工逐行比对。
      - name: D1 schema snapshot check
        working-directory: apps/api
        run: pnpm db:schema:check
      # 门禁 4：lint
      - run: pnpm lint

  deploy-preview:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 与 deploy.yml 同口径：全量历史才能拿到正确的提交总数与最近 Tag（vite.config.ts 版本注入依赖）
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 必须先出前端产物：wrangler.toml 的 [assets].directory = "../web/dist"，
      # 目录不存在时 `wrangler deploy --dry-run` 会直接报错退出（2026-10-22 CI 红灯原因）
      - name: Build Pages frontend
        run: pnpm --filter @freeidx/web build
        env:
          # 与 deploy.yml 同口径：后台「版本更新」页的「当前提交」取此值
          VITE_COMMIT_SHA: ${{ github.sha }}
      - name: Deploy Worker preview
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --dry-run
      # prod 发布为手动门禁（§13.4）：wrangler deploy --env prod 由人工触发
