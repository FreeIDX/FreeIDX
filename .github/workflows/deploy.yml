name: Deploy to Cloudflare

# 生产发布：自动开通/复用 D1 与 KV，把真实 ID 只写进构建工作区（不提交），再部署单个 Worker。
# 每次运行（push main 与手动触发）都先应用未应用的 D1 迁移再部署：迁移均为增量式，
# 已在 d1_migrations 表登记的文件自动跳过，不会改动既有数据，因此新增迁移无需再手动勾选。
# 首次上线：手动触发并勾上 run_seed（初始版块 + 首管）。
# 总开关：仓库 Variable CLOUDFLARE_DEPLOY 设为 false 可整体跳过发布；未创建时默认发布。

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_seed:
        description: 导入 seed/seed.sql（初始版块 + 首管，幂等）
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # 门禁（单一事实源：复用 ci.yml 的 gates = typecheck/i18n/test/迁移 dry-run/lint）。
  # 此前 deploy 与 CI 平行执行，CI 红灯时生产照常发布；现在生产发布必须先全绿。
  ci:
    # 发布总开关：变量未创建时默认发布；仅在仓库 Variable CLOUDFLARE_DEPLOY 显式设为 false 时跳过
    if: ${{ vars.CLOUDFLARE_DEPLOY != 'false' }}
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy:
    needs: ci
    if: ${{ vars.CLOUDFLARE_DEPLOY != 'false' }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 版本号 = 包版本 + 提交总数（vite.config.ts），浅克隆会把总数固定成 1，必须取全量历史
          fetch-depth: 0
      - name: 补拉上游 tags（版本判定用）
        # 后台「版本更新」页的当前版本靠 git describe 找最近 Tag；fork 经网页
        # "Sync fork" 只同步分支不同步 tags，这里从上游匿名拉取兜底，任何 fork 状态下版本判定都正确
        run: git fetch https://github.com/FreeIDX/FreeIDX.git '+refs/tags/*:refs/tags/*' --force
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 前置检查
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::缺少 Secret CLOUDFLARE_API_TOKEN"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::缺少 Secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - run: pnpm install --frozen-lockfile

      - name: 开通或复用 D1 / KV，并回填 wrangler.toml
        working-directory: apps/api
        run: |
          set -euo pipefail

          # 用 node 解析而非 jq：node 由 setup-node 保证存在，jq 依赖 runner 镜像
          d1_id() {
            npx wrangler d1 list --json 2>/dev/null | node -e '
              let s = "";
              process.stdin.on("data", c => s += c).on("end", () => {
                const hit = JSON.parse(s).find(x => x.name === "freeidx");
                process.stdout.write(hit ? hit.uuid : "");
              });'
          }
          kv_id() {
            npx wrangler kv namespace list 2>/dev/null | node -e '
              let s = "";
              process.stdin.on("data", c => s += c).on("end", () => {
                const hit = JSON.parse(s).find(x => x.title === "freeidx-cache");
                process.stdout.write(hit ? hit.id : "");
              });'
          }

          DB=$(d1_id || true)
          if [ -z "$DB" ] || [ "$DB" = "null" ]; then
            echo "D1 数据库 freeidx 不存在，创建中…"
            npx wrangler d1 create freeidx </dev/null >/dev/null
            DB=$(d1_id)
          fi
          [ -n "$DB" ] && [ "$DB" != "null" ] || { echo "::error::拿不到 D1 freeidx 的 uuid"; exit 1; }

          KV=$(kv_id || true)
          if [ -z "$KV" ] || [ "$KV" = "null" ]; then
            echo "KV 命名空间 freeidx-cache 不存在，创建中…"
            npx wrangler kv namespace create freeidx-cache </dev/null >/dev/null
            KV=$(kv_id)
          fi
          [ -n "$KV" ] && [ "$KV" != "null" ] || { echo "::error::拿不到 KV freeidx-cache 的 id"; exit 1; }

          sed -i -E "s|^database_id = .*|database_id = \"$DB\"|" wrangler.toml
          sed -i -E "s|^id = .*|id = \"$KV\"|" wrangler.toml

          if [ -n "${SITE_URL:-}" ]; then
            case "$SITE_URL" in
              https://[A-Za-z0-9._-]*)
                sed -i -E "s|^SITE_URL = .*|SITE_URL = \"$SITE_URL\"|" wrangler.toml ;;
              *)
                echo "::error::仓库 Variable SITE_URL 需为 https:// 开头的纯域名，当前值不合法"; exit 1 ;;
            esac
          else
            # 未设置属正常：主域名以后台「站点网址」为准，未配置时回落当前请求域名
            echo "未设置 Variable SITE_URL，主域名以后台「站点网址」为准（多域名绑定下推荐只配后台）"
          fi

          echo "D1=$DB  KV=$KV"
          grep -E '^(database_id|id|SITE_URL) ' wrangler.toml

      - name: 应用 D1 迁移（push 与手动触发均执行）
        working-directory: apps/api
        run: npx wrangler d1 migrations apply freeidx --remote

      - name: 导入种子数据
        if: ${{ inputs.run_seed }}
        working-directory: apps/api
        run: npx wrangler d1 execute freeidx --remote --file=./seed/seed.sql

      # 迁移门禁（2025-10 起）：Worker 的 SELECT 直接引用迁移新增的列（如 0024 的 bbs_forum.lang），
      # 迁移没应用就发版会让 GET /api/bootstrap 与版块列表直接 500。迁移已在上一关自动应用，
      # 这里仍做一次硬校验：远程库仍有未应用迁移 → 中止发布（防止 apply 被跳过、失败后继续，
      # 或本地新增迁移没生效时让代码先于 schema 上线）。
      - name: 迁移门禁（代码不得先于 schema 上线）
        working-directory: apps/api
        run: |
          set -euo pipefail
          if ! npx wrangler d1 execute freeidx --remote --json --command "SELECT name FROM d1_migrations" > /tmp/d1-applied.json; then
            echo "::error::读取远程 d1_migrations 失败：请检查 CLOUDFLARE_API_TOKEN 的 D1 权限与 freeidx 库是否已创建"
            exit 1
          fi
          node - <<'NODE'
          const fs = require('node:fs');
          // wrangler 可能在 JSON 前后打印提示行，截取第一个 [ 到最后一个 ] 再解析
          const txt = fs.readFileSync('/tmp/d1-applied.json', 'utf8');
          const raw = JSON.parse(txt.slice(txt.indexOf('['), txt.lastIndexOf(']') + 1));
          const rows = (Array.isArray(raw) ? raw : [raw]).flatMap((r) => r?.results ?? []);
          const applied = new Set(rows.map((r) => r.name));
          const local = fs.readdirSync('migrations').filter((f) => f.endsWith('.sql')).sort();
          const missing = local.filter((f) => !applied.has(f));
          if (missing.length) {
            console.error('::error::以下迁移尚未应用到远程库：' + missing.join(', ') + '；请检查上一关「应用 D1 迁移」的日志后重新运行流水线');
            process.exit(1);
          }
          console.log('迁移门禁通过：' + local.length + ' 个迁移均已应用');
          NODE

      - name: 构建前端
        run: pnpm --filter @freeidx/web build
        env:
          # 未设置时前端不渲染人机验证组件（Turnstile.tsx:28），不影响部署
          VITE_TURNSTILE_SITEKEY: ${{ vars.TURNSTILE_SITEKEY }}
          # 后台「版本更新」页的「当前提交」取此值
          VITE_COMMIT_SHA: ${{ github.sha }}

      - name: 部署 Worker（含前端静态资源）
        working-directory: apps/api
        run: npx wrangler deploy

      - name: 配置 R2 生命周期（tmp/ 前缀 1 天后过期）
        working-directory: apps/api
        run: |
          # 临时附件（上传但未提交）由 Worker 每小时档 GC（先删对象再删行）；
          # 桶上生命周期规则是最终兜底：即使 worker GC 因额度/异常没跑到，对象也不会永久残留。
          # 权限需 API Token 含 Workers R2 Storage Write；失败只告警，不阻断发布。
          if npx wrangler r2 bucket lifecycle set freeidx-files --file ./r2-lifecycle.json; then
            echo "R2 生命周期规则已配置（tmp/ 1 天）"
          else
            echo "::warning::R2 生命周期配置失败，请到 Dashboard → R2 → freeidx-files → Settings → Object Lifecycle Rules 手动添加「前缀 tmp/、过期 1 天」"
          fi

      - name: 写入运行摘要
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## 部署完成"
            echo ""
            echo "- 站点主域名：${SITE_URL:-以后台「站点网址」为准（未配置时用当前请求域名）}"
            echo "- D1/KV ID 由本次构建解析并回填，仓库里保持占位值"
            echo "- 运行时密钥（JWT_SECRET 等）在 Cloudflare 后台 Secrets，本流水线不覆盖"
          } >> "$GITHUB_STEP_SUMMARY"
